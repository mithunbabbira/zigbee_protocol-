<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shelf Master</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e8eef7;
      --muted: #8fa3bf;
      --on: #3dd68c;
      --off: #4b5563;
      --accent: #4f8cff;
      --danger: #ff6b6b;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: linear-gradient(180deg, #0b1020, var(--bg));
      color: var(--text);
      min-height: 100vh;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    .sub { color: var(--muted); margin-bottom: 24px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }
    .stat-value { font-size: 2rem; font-weight: 700; }
    .stat-label { color: var(--muted); font-size: 0.9rem; }
    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: white;
    }
    button.secondary { background: #2a3648; color: var(--text); }
    button.danger { background: var(--danger); }
    button.small { padding: 6px 12px; font-size: 0.85rem; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .table-wrap {
      background: #fff;
      border: 2px solid #217346;
      border-radius: 4px;
      overflow: auto;
      box-shadow: 0 4px 24px rgba(0,0,0,0.35);
    }
    .sheet-title {
      background: #217346;
      color: #fff;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    table.sheet {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      color: #1a1a1a;
      font-size: 0.95rem;
    }
    table.sheet th,
    table.sheet td {
      border: 1px solid #d4d4d4;
      padding: 10px 14px;
      text-align: left;
    }
    table.sheet th {
      background: #f3f3f3;
      color: #333;
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    table.sheet tbody tr:nth-child(even) { background: #fafafa; }
    table.sheet tbody tr:hover { background: #e8f4ea; }
    table.sheet tr.offline td { color: #999; background: #f9f9f9; }
    table.sheet .col-num { width: 48px; text-align: center; color: #666; background: #f3f3f3; font-weight: 600; }
    table.sheet .col-shelf { width: 90px; text-align: center; font-weight: 700; }
    table.sheet .col-count { width: 120px; text-align: center; font-size: 1.1rem; font-weight: 700; color: #217346; }
    table.sheet .mono { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.88rem; }
    table.sheet .connected-yes { color: #217346; font-weight: 600; }
    table.sheet .connected-no { color: #c0392b; font-weight: 600; }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 48px 16px;
    }
    .status-pill {
      display: inline-block;
      margin-left: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .live { color: var(--on); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Shelf Master <span class="status-pill" id="live">connecting...</span></h1>
    <p class="sub">Spreadsheet view of connected shelf nodes. Press the ESP32-C6 button to increment the count.</p>

    <div class="stats">
      <div class="card">
        <div class="stat-value" id="count">0</div>
        <div class="stat-label">Shelves connected</div>
      </div>
      <div class="card">
        <div class="stat-value" id="press-total">0</div>
        <div class="stat-label">Total button presses</div>
      </div>
      <div class="card">
        <div class="stat-value" id="on-count">0</div>
        <div class="stat-label">Lights ON</div>
      </div>
    </div>

    <div class="toolbar">
      <button onclick="setGroup(1)">All ON</button>
      <button class="secondary" onclick="setGroup(0)">All OFF</button>
      <button class="secondary" onclick="refresh()">Refresh</button>
      <button class="danger" onclick="clearPressCounts()">Clear counts</button>
    </div>

    <div class="table-wrap" id="table-wrap">
      <div class="empty">Waiting for shelves to join the coordinator...</div>
    </div>
  </div>

  <script>
    const tableWrapEl = document.getElementById('table-wrap');
    const countEl = document.getElementById('count');
    const pressTotalEl = document.getElementById('press-total');
    const onCountEl = document.getElementById('on-count');
    const liveEl = document.getElementById('live');

    function render(data) {
      if (data.serial_connected === false) {
        const hint = data.backend === 'zigbee2mqtt'
          ? 'Zigbee2MQTT offline — start broker + Zigbee2MQTT with SONOFF dongle'
          : 'coordinator not on USB — plug coordinator board into Mac (not shelf)';
        liveEl.textContent = hint;
        liveEl.className = 'status-pill';
      } else {
        liveEl.textContent = 'live';
        liveEl.className = 'status-pill live';
      }

      const nodes = data.nodes || [];
      const onlineNodes = nodes.filter(n => n.online);
      countEl.textContent = data.connected_count ?? onlineNodes.length;
      pressTotalEl.textContent = data.total_press_count ?? nodes.reduce((sum, n) => sum + (n.press_count || 0), 0);
      onCountEl.textContent = onlineNodes.filter(n => n.state === 1).length;

      if (!nodes.length) {
        tableWrapEl.innerHTML = '<div class="empty">No shelves discovered yet. Power on shelf boards near the coordinator.</div>';
        return;
      }

      const rows = nodes.map((node, index) => `
        <tr class="${node.online ? '' : 'offline'}">
          <td class="col-num">${index + 1}</td>
          <td class="col-shelf">${node.shelf_id ?? '—'}</td>
          <td class="mono">${node.addr}</td>
          <td class="${node.online ? 'connected-yes' : 'connected-no'}">${node.online ? 'Yes' : 'No'}</td>
          <td class="col-count">${node.press_count ?? 0}</td>
        </tr>
      `).join('');

      tableWrapEl.innerHTML = `
        <div class="sheet-title">Shelf register — live data</div>
        <table class="sheet">
          <thead>
            <tr>
              <th class="col-num">#</th>
              <th class="col-shelf">Shelf ID</th>
              <th>ESP32-C6 ID (IEEE)</th>
              <th>Connected</th>
              <th class="col-count">Button press count</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    async function refresh() {
      liveEl.textContent = 'scanning...';
      liveEl.className = 'status-pill';
      const res = await fetch('/api/scan', { method: 'POST' });
      render(await res.json());
    }

    async function setNode(addr, state) {
      await fetch(`/api/nodes/${encodeURIComponent(addr)}/state`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ state }),
      });
    }

    async function setGroup(state) {
      await fetch('/api/group/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ state }),
      });
    }

    async function clearPressCounts() {
      if (!confirm('Clear all button press counts?')) return;
      const res = await fetch('/api/press-counts/clear', { method: 'POST' });
      render(await res.json());
    }

    function connectEvents() {
      const source = new EventSource('/api/events');
      source.onopen = () => {
        liveEl.textContent = 'live';
        liveEl.className = 'status-pill live';
      };
      source.onmessage = (event) => {
        render(JSON.parse(event.data));
      };
      source.onerror = () => {
        liveEl.textContent = 'reconnecting...';
        liveEl.className = 'status-pill';
        source.close();
        setTimeout(connectEvents, 2000);
      };
    }

    refresh();
    connectEvents();
  </script>
</body>
</html>
